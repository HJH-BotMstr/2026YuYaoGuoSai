block_align_node:
  ros__parameters:
    # ── 触发接口 ──────────────────────────────────────────────────────────────
    trigger_topic: "/block_align/start"

    # ── tools/grasp 配置路径（BlockDetection 参数从此读取）─────────────────────
    tools_config_path: "/home/ysc/2026YuYaoGuoSai/tools/grasp/config.yaml"

    # ── 摄像头（机械臂 USB 摄像头，与 grasp_task 相同）────────────────────────
    camera_device: "/dev/video0"

    # ── 目标停止距离（视觉闭环距色块的目标距离，需现场标定）───────────────────
    # 修复 2026-08-14: 从 0.10m 增大到 0.20m，避免目标方块超出摄像头视野下边缘
    target_distance_m: 0.11

    # ── 对准阈值 ──────────────────────────────────────────────────────────────
    lateral_threshold_mm: 10.0      # X_cam 横向偏差死区（mm）从 10.0 改为 20.0
    distance_threshold_m: 0.02     # 前向距离死区（m）

    # ── 极性参数 [TODO: 现场实测后调整] ──────────────────────────────────────
    # -1: 目标偏右(X_cam>0) → Pose2D.y 为负 → 机器狗向右移动
    # +1: 目标偏右(X_cam>0) → Pose2D.y 为正 → 机器狗向左移动
    lateral_polarity: -1

    # ── 调试可视化 ────────────────────────────────────────────────────────────
    # 无 X display 环境（SSH/机上直跑）必须保持 false，否则 Qt 加载 xcb 失败会崩
    show_debug_window: true

    # ── 流程控制 ──────────────────────────────────────────────────────────────
    max_rounds: 5
    stable_frames: 10               # 从 10 改为 5，降低稳定帧数要求
    detect_timeout_s: 15.0
    cmd_vel_zero_timeout_s: 0.5
    move_timeout_s: 10.0

    # ── pose_controller 健康检查（2026-08-14 新增）─────────────────────────────
    # 运动链路看门狗：如果 /cmd_vel 或 /leg_odom2 超过此时长未收到，
    # 且当前正在等待运动完成，则认为 pose_controller 异常，发送 cancel 重置
    motion_watchdog_timeout_s: 3.0
    # 重置后的恢复等待时间（秒）
    motion_reset_recovery_s: 1.0

    # ── 横向搜索（wait_detect 超时后进入 STATE_SEARCH）─────────────────────────
    # 方向由 lateral_polarity 反号决定：polarity=-1 时向 body +y（左）搜，
    # 相当于 "从右往左" 扫（设计文档 §7.2）。
    search_step_m: 0.10        # 每步横移距离（米）
    search_max_steps: 10       # 最多步数（默认 1m 扫描范围）
    search_timeout_s: 60.0     # 搜索阶段的整体超时兜底
